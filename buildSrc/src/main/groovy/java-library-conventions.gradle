plugins {
    id "java-conventions"
    id "java-library"
    id "publishing-conventions"
}

jar {
    manifest {
        attributes("Implementation-Title": project.name,
                   "Implementation-Version": version)
    }
}

tasks.withType(Jar).configureEach {
    metaInf {
        from rootProject.file("LICENSE")
    }
}

dependencies {
    api("org.jspecify:jspecify")
}
